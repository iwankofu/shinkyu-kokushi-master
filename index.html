
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鍼灸 国試マスター v0.5</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#19263b;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
main{max-width:720px;margin:auto;padding:16px}
h1{font-size:23px}h2{font-size:19px}
.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #10203012}
button,select{font:inherit;width:100%;padding:13px;margin:5px 0;border-radius:10px;border:1px solid #cdd6e4;background:white;color:#19263b}
button{text-align:left;cursor:pointer}
.primary{background:#2157c6;color:white;border:0;text-align:center;font-weight:bold}
.muted{color:#66758b;font-size:13px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:#f3f6fc;border-radius:10px;padding:12px}
.stat strong{display:block;font-size:22px}
.green{background:#e0f5e8!important;border:2px solid #16804a!important;color:#064e2c}
.red{background:#ffe6e8!important;border:2px solid #c02b3c!important;color:#801923}
.gray{background:#f5f7fa}
.option{border-radius:10px;padding:12px;margin:8px 0;line-height:1.7}
.good{color:#137a48}.bad{color:#b52c39}
.bar{height:9px;background:#e5eaf1;border-radius:10px;overflow:hidden}
.fill{height:100%;background:#3b73d1}
.subject{padding:12px 0;border-bottom:1px solid #e6ebf2}
#quiz,#review,#finish{display:none}
.tag{display:inline-block;background:#eaf0fa;border-radius:99px;padding:4px 9px;font-size:12px;margin:3px 2px 3px 0}
.warn{background:#fff6e7;border:1px solid #e6c992;padding:12px;border-radius:10px;font-size:13px;line-height:1.7}
label{display:block;font-weight:650;margin-top:10px}
.note{line-height:1.8;font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
</style>
</head>
<body>
<main>
<h1>📘 鍼灸 国試マスター <small>v0.5</small></h1>
<p class="muted">教材準拠のオリジナル問題・全51問／5科目</p>

<section id="home" class="card">
<h2>学習を開始</h2>
<label>出題方式</label>
<select id="mode">
<option value="all">全科目ランダム</option>
<option value="subject">科目別</option>
<option value="am">午前科目のみ</option>
<option value="pm">午後科目のみ</option>
<option value="wrong">過去に間違えた問題</option>
<option value="unseen">未回答の問題</option>
<option value="weak">苦手科目を優先</option>
</select>
<div id="subjectWrap" style="display:none">
<label>科目</label><select id="subject"></select>
</div>
<label>1回の問題数</label>
<select id="limit">
<option value="10">10問</option>
<option value="20">20問</option>
<option value="all">すべて</option>
</select>
<button class="primary" onclick="start()">演習を開始</button>
<div id="warning" class="warn" style="display:none"></div>
<h2>学習成績</h2>
<div id="stats" class="grid"></div>
<h2>科目別の正答率・得意不得意</h2>
<div id="bySubject"></div>
<h2>午前・午後の科目設定</h2>
<p class="muted">午前・午後の科目割当ては未確認のため、ここで設定できます。未設定の科目は午前・午後モードに入りません。</p>
<div id="sessions"></div>
<button onclick="resetHistory()">学習履歴を削除</button>
</section>

<section id="quiz" class="card">
<p id="progress" class="muted"></p>
<div id="subjectTag"></div>
<h2 id="question"></h2>
<div id="choices"></div>
</section>

<section id="review" class="card">
<h2 id="judge"></h2>
<p id="answerLine" class="note"></p>
<h3>全選択肢の解説</h3>
<div id="explanations"></div>
<h3>関連知識・覚えるポイント</h3>
<p id="related" class="note"></p>
<p id="source" class="muted"></p>
<button class="primary" onclick="next()">次の問題へ</button>
</section>

<section id="finish" class="card">
<h2>演習終了</h2>
<p id="summary"></p>
<button class="primary" onclick="home()">成績を見る・トップへ</button>
</section>

<p class="muted">出典：2026.国家試験攻略テキスト.pdf。教材に基づくオリジナル問題です。最新法令・統計との照合は未完了です。</p>
</main>

const questions=raw.map((r,i)=>({
id:"q"+String(i+1).padStart(3,"0"),
subject:r[0],
source:"2026.国家試験攻略テキスト／"+r[0]+" p."+r[1],
q:r[2],
options:r[3].split("|"),
correct:r[4],
related:r[5]
}));

const KEY="shinkyu-master-v05";
const SESSION_KEY="shinkyu-master-session-v05";
let records={},sessions={};

try{records=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){}
try{sessions=JSON.parse(localStorage.getItem(SESSION_KEY)||"{}")||{}}catch(e){}

const subjects=[...new Set(questions.map(q=>q.subject))];
let queue=[],position=0,score=0,locked=false;

function el(id){return document.getElementById(id)}
function save(){
try{localStorage.setItem(KEY,JSON.stringify(records))}catch(e){}
}
function saveSessions(){
try{localStorage.setItem(SESSION_KEY,JSON.stringify(sessions))}catch(e){}
}
function show(id){
["home","quiz","review","finish"].forEach(x=>{
el(x).style.display=x===id?"block":"none";
});
window.scrollTo(0,0);
}
function attempts(q){return records[q.id]?.attempts||0}
function correct(q){return records[q.id]?.correct||0}
function pct(a,b){return a?Math.round(b/a*100):null}
function escapeText(s){
return String(s).replace(/[&<>"']/g,x=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
}[x]));
}

function renderStats(){
const n=questions.reduce((a,q)=>a+attempts(q),0);
const c=questions.reduce((a,q)=>a+correct(q),0);
const seen=questions.filter(q=>attempts(q)>0).length;

el("stats").innerHTML=[
["累計回答",n+"回"],
["全体正答率",n?pct(n,c)+"%":"未回答"],
["学習済み",seen+"/"+questions.length+"問"],
["誤答経験",questions.filter(q=>attempts(q)>correct(q)).length+"問"]
].map(x=>'<div class="stat">'+x[0]+'<strong>'+x[1]+"</strong></div>").join("");

const active=subjects.map(s=>{
const a=questions.filter(q=>q.subject===s);
return{
s,total:a.length,
n:a.reduce((x,q)=>x+attempts(q),0),
c:a.reduce((x,q)=>x+correct(q),0)
};
});

const ranked=active.filter(x=>x.n>0)
.sort((a,b)=>pct(b.n,b.c)-pct(a.n,a.c));
const high=ranked[0]?.s;
const low=ranked[ranked.length-1]?.s;

el("bySubject").innerHTML=active.map(x=>{
const p=pct(x.n,x.c);
return '<div class="subject"><strong>'+
escapeText(x.s)+'</strong> <span class="tag">'+
x.total+'問収録</span>'+
(x.n&&ranked.length>1&&high!==low&&x.s===high?
'<span class="tag">得意候補</span>':"")+
(x.n&&ranked.length>1&&high!==low&&x.s===low?
'<span class="tag">苦手候補</span>':"")+
'<p class="muted">累計 '+x.c+"/"+x.n+
" 正解 ・ 正答率 "+
(p===null?"未回答":p+"%")+
'</p><div class="bar"><div class="fill" style="width:'+
(p||0)+'%"></div></div></div>';
}).join("");
}

function setup(){
el("subject").innerHTML=subjects.map(s=>
"<option>"+escapeText(s)+"</option>").join("");

el("sessions").innerHTML="";
subjects.forEach(s=>{
let d=document.createElement("div");
d.className="row";
let label=document.createElement("span");
label.textContent=s;
let sel=document.createElement("select");

[["","未設定"],["am","午前"],["pm","午後"]].forEach(([v,t])=>{
let o=document.createElement("option");
o.value=v;o.textContent=t;sel.appendChild(o);
});
sel.value=sessions[s]||"";
sel.onchange=()=>{
sessions[s]=sel.value;
saveSessions();
};
d.append(label,sel);
el("sessions").appendChild(d);
});

el("mode").onchange=()=>{
el("subjectWrap").style.display=
el("mode").value==="subject"?"block":"none";
};
renderStats();
}

function start(){
let mode=el("mode").value;
let pool=questions.filter(q=>
mode==="subject"?q.subject===el("subject").value:
mode==="am"||mode==="pm"?sessions[q.subject]===mode:
mode==="wrong"?attempts(q)>correct(q):
mode==="unseen"?attempts(q)===0:true
);

let warning=el("warning");
warning.style.display="none";

if(mode==="weak"){
const sums=subjects.map(s=>{
let qs=questions.filter(q=>q.subject===s);
return{
s,
n:qs.reduce((a,q)=>a+attempts(q),0),
c:qs.reduce((a,q)=>a+correct(q),0)
};
}).filter(x=>x.n>0);

if(sums.length){
sums.sort((a,b)=>a.c/a.n-b.c/b.n);
pool=questions.filter(q=>q.subject===sums[0].s);
}else{
warning.textContent="学習履歴がまだないため、全科目から出題します。";
warning.style.display="block";
}
}

if(!pool.length){
warning.textContent=
(mode==="am"||mode==="pm")?
"該当科目がありません。トップ画面下部で午前・午後を設定してください。":
"条件に合う問題がありません。出題方式を変更してください。";
warning.style.display="block";
return;
}

for(let i=pool.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[pool[i],pool[j]]=[pool[j],pool[i]];
}

let n=el("limit").value;
queue=pool.slice(0,n==="all"?pool.length:Number(n));
position=0;
score=0;
renderQuestion();
}

function renderQuestion(){
locked=false;
const q=queue[position];
el("progress").textContent=(position+1)+" / "+queue.length+"問";
el("subjectTag").textContent=q.subject;
el("question").textContent=q.q;
el("choices").innerHTML="";

q.options.forEach((o,i)=>{
let b=document.createElement("button");
b.textContent="①②③④"[i]+" "+o;
b.onclick=()=>answer(i);
el("choices").appendChild(b);
});
show("quiz");
}

function answer(i){
if(locked)return;
locked=true;
const q=queue[position];
const ok=i===q.correct;
if(ok)score++;

const r=records[q.id]||{attempts:0,correct:0};
r.attempts++;
if(ok)r.correct++;
r.last=Date.now();
records[q.id]=r;
save();

el("judge").textContent=ok?"正解！":"不正解";
el("judge").className=ok?"good":"bad";

el("answerLine").textContent=
"正解："+"①②③④"[q.correct]+" "+q.options[q.correct]+
(ok?"":" ／ あなたの回答："+"①②③④"[i]+" "+q.options[i]);

el("explanations").innerHTML="";

q.options.forEach((o,j)=>{
let d=document.createElement("div");
d.className="option "+(j===q.correct?"green":j===i?"red":"gray");

let b=document.createElement("strong");
b.textContent="①②③④"[j]+" "+o+
(j===q.correct?"　✓ 正解":j===i?"　✕ あなたの回答":"");

let p=document.createElement("div");
p.className="note";
p.textContent=j===q.correct?
"この設問の正答です。"+q.related:
"この選択肢は、この設問の正答ではありません。正答の「"+
q.options[q.correct]+"」と区別してください。"+q.related;

d.append(b,p);
el("explanations").appendChild(d);
});

el("related").textContent=q.related;
el("source").textContent="教材出典："+q.source;
show("review");
}

function next(){
position++;
if(position<queue.length){
renderQuestion();
}else{
el("summary").textContent=
queue.length+"問中 "+score+"問正解（"+
pct(queue.length,score)+"%）";
show("finish");
}
}

function home(){
renderStats();
show("home");
}

function resetHistory(){
if(confirm("学習履歴を削除しますか？")){
records={};
save();
renderStats();
}
}

setup();
home();
</script>
</body>
</html>
